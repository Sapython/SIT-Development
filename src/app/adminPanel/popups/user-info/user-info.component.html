<ion-content class="ion-padding">
  <ion-item lines="none">
    <ion-avatar slot="start">
      <img [src]="user.photoURL" />
    </ion-avatar>
    <ion-label>{{user.displayName}}</ion-label>
  </ion-item>
  <hr>
  <ion-row class="ion-justify-content-evenly">
    <ion-chip (click)="removeUser()" color="danger">
      Remove
    </ion-chip>
    <ion-chip (click)="blockUser()" color="warning">
      Block
    </ion-chip>
    <ion-chip (click)="resetUser()" color="primary">
      Reset
    </ion-chip>
  </ion-row>
  <ion-button (click)="popoverController.dismiss()" expand="block" fill="border" shape="round" color="danger">
    <ion-label color="danger">Cancel</ion-label>
  </ion-button>
</ion-content>
