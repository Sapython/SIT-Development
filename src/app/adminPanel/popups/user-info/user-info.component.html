<ion-content class="ion-padding">
  <ion-item lines="none">
    <ion-avatar slot="start">
      <img [src]="user.image" />
    </ion-avatar>
    <ion-label>{{user.name}}</ion-label>
  </ion-item>
  <hr>
  <ion-row class="ion-justify-content-evenly">
    <ion-chip (click)="removeUser()" color="danger">
      Remove
    </ion-chip>
    <ion-chip (click)="blockUser()" color="warning">
      Block
    </ion-chip>
    <ion-chip (click)="resetUser()" color="primary">
      Reset
    </ion-chip>
  </ion-row>
</ion-content>
