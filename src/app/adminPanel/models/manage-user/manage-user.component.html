<ion-header>
  <ion-toolbar>
    <ion-title>Tracking</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/configuration" (click)="modalController.dismiss()"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let item of users" button (click)="manageUser(item)">
      <ion-avatar slot="start">
        <img [src]="item.photoURL" />
      </ion-avatar>
      <ion-label>{{item.displayName}}</ion-label>
      <ion-label>{{item.email}}</ion-label>
      <ion-badge *ngIf="item.access.access==='worker'" color="primary" >Employee</ion-badge>
      <ion-badge *ngIf="item.access.access==='admin'" color="success" >Admin</ion-badge>
      <ion-badge *ngIf="item.access.access==='supervisor'" color="warning" >Supervisor</ion-badge>
      <ion-badge *ngIf="item.access.access==='guest'" color="guest" >Guest</ion-badge>
    </ion-item>
  </ion-list>
</ion-content>
