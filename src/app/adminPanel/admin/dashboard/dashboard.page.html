<ion-list>
    <ion-item button (click)="openUsersModal()">
      <ion-label>Manage Users</ion-label>
      <ion-icon name="arrow-forward-outline" color="primary"></ion-icon>
    </ion-item>
    <ion-item-sliding>
      <ion-item>
        <ion-label>Item</ion-label>
      </ion-item>
      <ion-item-options side="start" >
        <ion-item-option color="primary" (click)="saveToFavorite('item')">Favorite</ion-item-option>
      </ion-item-options>
      <ion-item-options side="end" >
        <ion-item-option color="danger" (click)="deleteAlert('item')">Unread</ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>
