<app-header></app-header>

<ion-content>
  <p class="heading">Account Info</p>
  <form class="container" [formGroup]="userDataForm">
    <img [src]="userImage" alt="">
    <p *ngIf="!editable" class="text-center">{{name}}</p>
    <ion-item>
      <ion-label color="primary">Name</ion-label>
      <ion-input type="text" formControlName="name" [value]="name" placeholder="Full Name" *ngIf="editable" (ionChange)="setValue('name',$event)"></ion-input>
    </ion-item>
    <div class="parentdetails">
      <ion-item>
        <ion-label color="primary" slot="start">Edit</ion-label>
        <ion-toggle [value]="editable" (ionChange)="editable=!editable" [checked]="editable" color="primary"></ion-toggle>
      </ion-item>
      <ion-item>
        <ion-label color="primary" slot="start">Email</ion-label>
        <ion-label *ngIf="!editable">{{email}}</ion-label>
        <ion-input [value]="email" formControlName="email" type="email" *ngIf="editable" (ionChange)="setValue('email',$event)" #emailInput></ion-input>
      </ion-item>
      <ion-item>
        <ion-label color="primary" slot="start">Access</ion-label>
        <ion-chip color="primary" >{{access}}</ion-chip>
      </ion-item>
      <ion-item>
        <ion-label color="primary" slot="start">Attendance</ion-label>
        <ion-label>{{attendance}}</ion-label>
      </ion-item>
      <ion-item>
        <ion-label color="primary" slot="start">Phone Number</ion-label>
        <ion-label *ngIf="!editable">{{phoneNumber}}</ion-label>
        <ion-input type="text" formControlName="phoneNumber" [value]="phoneNumber" *ngIf="editable" (ionChange)="setValue('phoneNumber',$event)"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label color="primary" slot="start">User Id</ion-label>
        <ion-label>{{userId}}</ion-label>
      </ion-item>
      <ion-button (click)="save()" expand="block" fill="solid" shape="round" *ngIf="editable">
        Save
      </ion-button>
    </div>
  </form>
</ion-content>
