<app-header></app-header>
<ion-content>
    <div class="container">
        <p>Employee List</p>
    </div>
    <!-- <app-employee-data-widget *ngFor="let employee of employees" 
        [presentDay]="round((employee.attendanceCount / totaldate)*100)"
        [absent]="round(((totaldate-employee.attendanceCount)/totaldate)*100)"
        [name]="employee.displayName"
        [phoneNumber]="employee.phoneNumber"
        [userData]="employee"
        [userImage]="employee.photoURL"
    ></app-employee-data-widget> -->
    <ion-item *ngFor="let employee of employees" (click)="openUser(employee)" button detail="true">
        <ion-label>{{employee.displayName}}</ion-label>
        <ion-chip [color]="isPresent(employee.attendanceDate) ? 'success' : 'danger'" mode="ios" outline="true" slot="end">
            <ion-label>{{isPresent(employee.attendanceDate) ? 'Present' : 'Absent'}}</ion-label>
        </ion-chip>
        <!-- <ion-toggle value="true" slot="end">            
        </ion-toggle> -->
    </ion-item>
    <img src="assets/UI/Images/empty.svg" referrerpolicy="no-referrer"  *ngIf="!employees" alt="Nothing In here" class="noData">
</ion-content>
