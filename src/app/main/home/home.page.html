<!-- <app-header title="Home"></app-header> -->

<ion-content>
    <aside>
        <div id="topNav">
            <button>
                <ion-menu-button></ion-menu-button>
            </button>
            <div class="greetings">
                <p class="greet">Welcome</p>
                <p class="username">
                    {{displayName}}
                </p>
                <app-user-image></app-user-image>
            </div>
        </div>
        <div id="card">
            <div>
                <p class="head">Summary</p>
                <table>
                    <tr>
                        <td>Pending</td>
                        <td style="color:rgb(255, 107, 107)">&nbsp;&nbsp;&nbsp;&nbsp;{{pending}}</td>
                    </tr>
                    <tr>
                        <td>Recieved</td>
                        <td style="color:rgb(107, 201, 255)">&nbsp;&nbsp;&nbsp;&nbsp;{{recieved}}</td>
                    </tr>
                    <tr>
                        <td>Unloaded</td>
                        <td style="color:rgb(61, 194, 94)">&nbsp;&nbsp;&nbsp;&nbsp;{{unloaded}}</td>
                    </tr>
                </table>
            </div>
            <div style="display: block" class="chart">
                <canvas baseChart
                  [data]="doughnutChartData"
                  [legend]="false"
                  [type]="doughnutChartType">
                </canvas>
            </div>
        </div>
    </aside>
    <main>
        <div class="buttonLinks">
            <button routerLink="../add-employee">
                <ion-icon name="person-add"></ion-icon>
            </button>
            <button>
                <ion-icon name="bug"></ion-icon>
            </button>
            <button>
                <ion-icon name="bar-chart"></ion-icon>
            </button>
            <button>
                <ion-icon name="people" routerLink="../employeeList"></ion-icon>
            </button>
            <button>
                <ion-icon name="document-text"></ion-icon>
            </button>
            <button>
                <ion-icon name="sync-circle"></ion-icon>
            </button>
        </div>
        <p class="title">Dashboard</p>
        <div class="quickLinks">
            <button class="linkCard" routerLink="../employeeList">
                <div>
                    <p>Employee</p>
                    <p>List</p>
                </div>
                <img src="assets/UI/QuickLinks/employeeList.svg" alt="Employee working">
            </button>
            <div class="linkCard" routerLink="../pending-sit">
                <div>
                    <p>Pending</p>
                    <p>SIT List</p>
                </div>
                <img src="assets/UI/QuickLinks/pendingLedger.svg" alt="">
            </div>
            <div class="linkCard" routerLink="../recieved-sit">
                <div>
                    <p>Recieved</p>
                    <p>SIT List</p>
                </div>
                <img src="assets/UI/QuickLinks/recievedLedger.svg" alt="">
            </div>
            <div class="linkCard" routerLink="../driver-list">
                <div>
                    <p>Driver</p>
                    <p>List</p>
                </div>
                <img src="assets/UI/QuickLinks/driver.svg" alt="">
            </div>
        </div>
        <p class="text-1">Recently Opened</p>
        <app-sit-ledger-widget 
        *ngFor="let item of sitLedgers"
            [dispatchDate]="item.dispatchDate"
            [delivery]="item.delivery"
            [expectedDelivery]="item.expectedDelivery"
            [gateEntryDate]="item.gateEntryDate"
            [gateEntryNo]="item.gateEntryNo"
            [mfgLocation]="item.mfgLocation"
            [productCode]="item.productCode"
            [productName]="item.productName"
            [quantity]="item.quantity"
            [recPlantDesc]="item.recPlantDesc"
            [remarks]="item.remarks"
            [suppPlant]="item.suppPlant"
            [suppPlantDesc]="item.suppPlantDesc"
            [storageLocation]="item.storageLocation"
            [transName]="item.transName"
            [vehicleNo]="item.vehicleNo"
            [status]="item.status"
        ></app-sit-ledger-widget>

        <!-- <div class="groupCard">
            <app-employee-data-widget></app-employee-data-widget>
        </div>
        <app-expense-ledger
            expenseName="Gate broken"
            ledgerNo="LEDGER1234"
            [charge]="20400"
            condition="danger"
            [servicable]="false"
            date="2020-05-05"
            reason="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Curabitur cursus tincidunt commodo. Nunc justo nisi, vestibulum facilisis porta vestibulum, ultrices volutpat arcu. Quisque nec dui mattis, fringilla magna in, vulputate enim. Fusce ut euismod ligula, id laoreet ex."
        ></app-expense-ledger>
        <app-dala-widget 
        *ngFor="let item of dalaLedgers"
            [driverName]="item.driverName"
            [driverImage]="item.driverImage"
            [driverNumber]="item.driverNumber"
            [driverId]="item.driverId"
            [charge]="item.charge"
            [ledgerNo]="item.ledgerNo"
            [coordinator]="item.coordinator"
        ></app-dala-widget>

        <div id="sit-ledger-filters">
            <h3 id="filters-heading">Filters</h3>
            <div id="filters-dropdown">
                <button id="filters-button" #filtersButton (click)="showFiltersList=!showFiltersList">Date <ion-icon name="chevron-down"></ion-icon></button>
                <ul id="filters-list" #filtersList *ngIf="showFiltersList">
                    <li class="filter-list-item">Date</li>
                    <li class="filter-list-item">Name</li>
                    <li class="filter-list-item">xyz</li>
                </ul>
              </div>
        </div>

        
        <app-product-ledger-widget
        [Safe] = "35"
        [Damage]="65"></app-product-ledger-widget>
        <app-dala-widget></app-dala-widget>

        <div class="box">
            <app-employee-data-widget></app-employee-data-widget>
        </div> 
        <div class="pending">
            <p style="color: #F57171;margin-left: 10px;font-size:20px;font-weight: bold;">Pending</p>
            <app-product-ledger-widget></app-product-ledger-widget>
            <button class="button-22">See All Pending Events</button>
    
        </div>
        <div class="pending">
            <p style="color: var(--ion-color-warning);margin-left: 10px;font-size:20px;font-weight: bold;">Recieved</p>
            <app-sit-ledger-widget></app-sit-ledger-widget>
            <app-sit-ledger-widget></app-sit-ledger-widget>
            <button class="button-22">See All Pending Events</button>
    
        </div>
        <div class="pending">
            <p style="color:#23C258; margin-left: 10px;font-size:20px;font-weight: bold;">Unloaded</p>
            <app-sit-ledger-widget></app-sit-ledger-widget>
            <app-sit-ledger-widget></app-sit-ledger-widget>
            <button class="button-22">See All Pending Events</button>
    
        </div>     
    </main>
</ion-content>
