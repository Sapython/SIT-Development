<ion-content>
    <aside>
        <div id="topNav">
            <button>
                <ion-icon name="notifications-outline"></ion-icon>
            </button>
            <div class="greetings">
                <p class="greet">Welcome</p>
                <p class="username">
                    {{displayName}}
                </p>
                <app-user-image></app-user-image>
            </div>
        </div>
        <div id="card">
            <div>
                <p class="head">Summary</p>
                <table>
                    <tr>
                        <td>Pending</td>
                        <td style="color:rgb(255, 107, 107)">&nbsp;&nbsp;&nbsp;&nbsp;{{pending}}</td>
                    </tr>
                    <tr>
                        <td>Recieved</td>
                        <td style="color:rgb(107, 201, 255)">&nbsp;&nbsp;&nbsp;&nbsp;{{recieved}}</td>
                    </tr>
                    <tr>
                        <td>Unloaded</td>
                        <td style="color:rgb(61, 194, 94)">&nbsp;&nbsp;&nbsp;&nbsp;{{unloaded}}</td>
                    </tr>
                </table>
            </div>
            <div style="display: block" class="chart">
                <canvas baseChart
                  [data]="doughnutChartData"
                  [legend]="false"
                  [type]="doughnutChartType">
                </canvas>
            </div>
        </div>
    </aside>
    <main>
        <div class="buttonLinks">
            <button>
                <ion-icon name="person-add"></ion-icon>
            </button>
            <button>
                <ion-icon name="bug"></ion-icon>
            </button>
            <button>
                <ion-icon name="bar-chart"></ion-icon>
            </button>
            <button>
                <ion-icon name="people"></ion-icon>
            </button>
            <button>
                <ion-icon name="document-text"></ion-icon>
            </button>
            <button>
                <ion-icon name="sync-circle"></ion-icon>
            </button>
        </div>
        <p class="title">Dashboard</p>
        <div class="quickLinks">
            <div class="linkCard">
                <div>
                    <p>Employee</p>
                    <p>List</p>
                </div>
                <img src="assets/UI/QuickLinks/employeeList.svg" alt="Employee working">
            </div>
            <div class="linkCard">
                <div>
                    <p>Pending</p>
                    <p>Ledger List</p>
                </div>
                <img src="assets/UI/QuickLinks/pendingLedger.svg" alt="">
            </div>
            <div class="linkCard">
                <div>
                    <p>Recieved</p>
                    <p>Ledger List</p>
                </div>
                <img src="assets/UI/QuickLinks/recievedLedger.svg" alt="">
            </div>
            <div class="linkCard">
                <div>
                    <p>Driver</p>
                    <p>List</p>
                </div>
                <img src="assets/UI/QuickLinks/driver.svg" alt="">
            </div>
        </div>
        <p class="text-1">Recently Opened</p>
        <div class="groupCard">
            <app-employee-data-widget></app-employee-data-widget>
        </div>
        <app-expense-ledger
            expenseName="Gate broken"
            ledgerNo="LEDGER1234"
            [charge]="20400"
            condition="danger"
            [servicable]="false"
            date="2020-05-05"
            reason="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Curabitur cursus tincidunt commodo. Nunc justo nisi, vestibulum facilisis porta vestibulum, ultrices volutpat arcu. Quisque nec dui mattis, fringilla magna in, vulputate enim. Fusce ut euismod ligula, id laoreet ex."
        ></app-expense-ledger>
        <app-dala-widget
            driverName="John doe"
            driverImage="https://i.pravatar.cc/300?img=1"
            driverNumber="+91-1234567890"
            driverId="DRIVER123"
            [charge]="20000"
            ledgerNo="L1234354"
            coordinator="Test Big Name"
        ></app-dala-widget>
