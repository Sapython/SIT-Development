<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="modalController.dismiss()"><ion-icon name="arrow-back-outline"></ion-icon></ion-button>
    </ion-buttons>
    <ion-title>Recieved Log Data</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
    <ion-list *ngIf="name">
       <ion-item>
         <ion-label>Name</ion-label>
         <ion-label slot="end" color="primary">{{name}}</ion-label>
       </ion-item>
      <ion-item>
        <ion-label>Dispatch Date</ion-label>
        <ion-label slot="end" color="primary">{{dispatchDate}}</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Expected Delivery</ion-label>
        <ion-label slot="end" color="primary">{{expectedDelivery}}</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Delivery Code</ion-label>
        <ion-label slot="end" color="primary">{{Deliverycode}}</ion-label>
      </ion-item>
    </ion-list>
    <ion-spinner name="crescent" *ngIf="!name"></ion-spinner>
    <hr>
    <ion-text color="primary">
      <h3>Vehicle Detail</h3>
    </ion-text>
    <ion-list>
      <ion-item>
        <ion-label>Vehicle No:</ion-label>
        <ion-label color="primary">{{products[0]?.vehicleNo}}</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Vehicle Type:</ion-label>
        <ion-label color="primary">{{vehicleType}}</ion-label>
      </ion-item>
      <div uk-lightbox>
        <a class="uk-button uk-button-default" [href]="vehicleImage">See Vehicle Image</a>
      </div>
    </ion-list>
    <hr>
    <ion-text color="primary">
      <h3>Coordinator</h3>
    </ion-text>
    <ion-item *ngIf="coordinator">
      <ion-avatar slot="start">
        <img [src]="coordinator.photoURL">
      </ion-avatar>
      <ion-label>{{coordinator.displayName}}</ion-label>
    </ion-item>
    <ion-spinner name="crescent" *ngIf="!coordinator"></ion-spinner>
    <hr>
    <ion-text color="primary">
      <h3>Products</h3>
    </ion-text>
    <app-product-ledger-widget 
      *ngFor="let product of products"
      [sellerName]="product.supplyPlantName"
      [itemName]="product.productName"
      [safe]="toNumber(product.quantity)"
      [ledgerNo]="sitId"
      [productCode]="product.productCode"
    ></app-product-ledger-widget>
    <img src="assets/UI/Images/empty.svg" *ngIf="!products" alt="Nothing In here" class="noData">
    <hr>
</ion-content>
