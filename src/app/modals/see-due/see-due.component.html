<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/main/app/labour-ledger" (click)="closeModal()" color="primary"></ion-back-button>
    </ion-buttons>
    <ion-title>See Due</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
    <ion-list>
       <ion-item>
         <ion-label>Labour Paid</ion-label>
         <ion-label slot="end" color="primary">{{amount}}</ion-label>
       </ion-item>
       <ion-item>
        <ion-label>Labour Name</ion-label>
        <ion-text slot="end" color="primary">{{sitName}}</ion-text>
      </ion-item>
      <ion-text color="primary">
        <h3>Previous Work</h3>
      </ion-text>
      <ion-card *ngFor="let work of workings">
        <table>
          <tr>
            <th>Type</th>
            <th>Value</th>
          </tr>
          <tr>
            <td>Supplier Name</td>
            <td>{{work.supplierName}}</td>
          </tr>
          <tr>
            <td>Supplier Code</td>
            <td>{{work.supplierCode}}</td>
          </tr>
          <tr>
            <td>Sit Id</td>
            <td>{{work.sitId}}</td>
          </tr>
          <tr>
            <td>Labour Charge</td>
            <td>{{work.value}}</td>
          </tr>
        </table>
      </ion-card>
      <img src="assets/UI/Images/empty.svg" *ngIf="!workings" alt="Nothing In here" class="noData">
      <ion-spinner name="crescent" color="primary" *ngIf="!foundWorking"></ion-spinner>
    </ion-list>
    <hr>
</ion-content>
