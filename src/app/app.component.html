<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content id="container">
        <div id="photo-container">
          <app-user-image></app-user-image>
        </div>
        <div id="options-container">
          <ion-list id="options">
            <ion-menu-toggle auto-hide="false" class="option">
              <ion-item routerDirection="root"  (click)="navigate('labour-ledger')" detail="false">Labour Ledger</ion-item>
            </ion-menu-toggle>
            <ion-menu-toggle auto-hide="false" class="option">
              <ion-item routerDirection="root"  (click)="navigate('sit-overview')" detail="false">SIT Log</ion-item>
            </ion-menu-toggle>
            <ion-menu-toggle auto-hide="false" class="option">
              <ion-item routerDirection="root" (click)="navigate('employeeList')" detail="false">Employee List</ion-item>
            </ion-menu-toggle>
            <ion-menu-toggle auto-hide="false" class="option">
              <ion-item routerDirection="root"  (click)="navigate('account-page')" detail="false">Account</ion-item>
            </ion-menu-toggle>
          </ion-list>
          <ion-button color="primary" id="logout-button">Logout <ion-icon slot="end" name="person"></ion-icon>
          </ion-button>
        </div>
        <div id="footer">
          <ion-text>
            <h3 id="developed-by">Developed by</h3>
            <p id="swayambhu-innovations">Shreeva Softech Pvt. Ltd.</p>
          </ion-text>
          <button id="more-info">More Info <ion-icon slot="end" name="arrow-forward"></ion-icon>
          </button>
        </div>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
  <div id="incompatible" [ngStyle]="{'display': useIncompatible ? 'flex' : 'none'}">
    <p>
      Application not supported for this resolution.
    </p>
    <button (click)="useIncompatible = true">I still want to use.</button>
  </div>
</ion-app>
