<div class="container">
  <div class="box">
    <div class="img-and-name">
      <img src="assets/UI/Images/profile.jpg" alt="">
      <div>
        <p>{{sellerName}}</p>
        <p>{{itemName}}</p>
      </div>
    </div>
  </div>
  <div class="code-and-price">
    <div class="details">
      <p><strong>Code: </strong>{{ledgerNo}}</p>
      <p><strong>Product: </strong>{{productCode}}</p>
    </div>
    <div class="buttons">
      <div class="safe">
        <p>Safe:</p>
        <div>{{safe}}</div>
      </div>
      <div class="damaged">
        <p>Damaged:</p>
        <div>{{damage}}</div>
      </div>
    </div>
  </div>
</div>
