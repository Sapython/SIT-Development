<div class="container">
  <div class="box">
    <div class="img-and-name">
      <img src="assets/UI/Images/profile.jpg" alt="">
      <p>{{Bakery}}<br><span>{{ItemName}}</span></p>
    </div>
    <div class="chart">
      <canvas baseChart
        [data]="doughnutChartData"
        [legend]="false"
        [type]="doughnutChartType">
      </canvas>
  </div>
  </div>
  <div class="code-and-price">
    <div class="details">
      <p><span>Ledger number: </span>{{Ledgerno}}</p>
      <p><span>Price: </span>{{Price}}</p>
    </div>
    <div class="buttons">
      <p>Safe    <span>Damage</span></p>
      <button class="button1">{{Safe}}Kg</button>
      <button class="button2">{{Damage}}Kg</button>
    </div>
  </div>
</div>
