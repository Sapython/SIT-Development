<div class="container">
  <div class="image">
    <img src="assets/UI/Images/profile.jpg" alt="error loading image" srcset="">
  </div>
  <div class="data">
    <h2>{{name}}</h2>
    <p>{{phoneNumber}}</p>
  </div>
  <div class="icons">
    <ion-icon name="call" style="margin-bottom: 10px;"></ion-icon>
    <ion-icon name="trash" style="margin-bottom: -10px;"></ion-icon>
  </div>
  <div style="display: block" class="chart">
    <canvas baseChart [data]="doughnutChartData" [legend]="false" [type]="doughnutChartType">
    </canvas>
  </div>
</div>
