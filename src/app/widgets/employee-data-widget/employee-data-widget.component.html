<div class="container">
  <div class="data">
    <h2>{{name}}</h2>
    <ion-row class="ion-justify-content-between ion-margin-top ion-align-items-center">
      <ion-label color="success"><ion-icon name="checkmark-circle"></ion-icon>: {{presentDay}}</ion-label>
      <ion-label color="danger"><ion-icon name="close"></ion-icon>: {{absent}}</ion-label>
    </ion-row>
  </div>
  <div class="icons">
    <ion-button fill="clear" href="tel:{{phoneNumber}}"><ion-icon name="call" style="margin-bottom: 10px;"></ion-icon></ion-button>
    <ion-button fill="clear" (click)="deleteUser()"><ion-icon name="trash" style="margin-bottom: -10px;"></ion-icon></ion-button>
  </div>
  <div>
    <div style="display: block" class="chart">
      <canvas baseChart [data]="doughnutChartData" [legend]="false" [type]="doughnutChartType">
      </canvas>
    </div>
  </div>

</div>
